# Agente documental: el bot que atiende Bitrix y, aparte, el panel de lectura.
# Uso: docker compose -f infra/docker-compose.yml up -d --build   (ver docs/despliegue.md)
# HTTPS lo pone el proxy del servidor: tiene que llegar desde internet a 127.0.0.1:${AGENTE_PUERTO_LOCAL}/bitrix/eventos.
services:
  agente:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      BITRIX24_PUERTO_EVENTOS: "3000"
      BITRIX24_TOKENS_ARCHIVO: /datos/bitrix-tokens.json
      AGENTE_DATOS_CARPETA: /datos/conversaciones
    volumes:
      - datos:/datos                    # tokens de la app de Bitrix y conversaciones (datos de socios): con respaldo y fuera del repo
    ports:
      - "127.0.0.1:${AGENTE_PUERTO_LOCAL:-3010}:3000"

  # Panel de lectura (prompt, escenarios, reglas, evals y sus conversaciones de prueba). No tiene login:
  # no exponerlo a internet sin protegerlo en el proxy.
  panel:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/panel/servidor.js"]
    environment:
      PANEL_PUERTO: "3011"
    ports:
      - "127.0.0.1:${PANEL_PUERTO_LOCAL:-3011}:3011"

volumes:
  datos:
